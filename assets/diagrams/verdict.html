<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verdict Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>
  .body{flex:1;margin-top:26px;display:grid;grid-template-columns:1fr 560px;gap:44px;min-height:0;}
  .left{display:flex;flex-direction:column;gap:26px;min-height:0;}
  .idea-box{background:#fff;border:2px solid var(--charcoal);padding:30px 34px;position:relative;}
  .idea-box .lbl,.panel .lbl{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);}
  .idea-box .idea{font-family:var(--serif);font-size:44px;line-height:1.08;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .idea-box .who{font-size:21px;color:var(--ink-2);margin-top:14px;}
  .stamp{position:absolute;top:-22px;right:26px;padding:11px 20px;color:#fff;font-weight:700;font-size:19px;
    letter-spacing:.08em;text-transform:uppercase;transform:rotate(2deg);box-shadow:3px 4px 10px rgba(0,0,0,.2);}
  .stamp.test{background:var(--dot-green);}
  .stamp.narrow{background:var(--dot-amber);color:#3a2e00;}
  .stamp.stop{background:var(--dot-red);}
  .stamp.pending{background:var(--ink-muted);}
  .read{font-size:24px;line-height:1.35;color:var(--charcoal);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  .quote{font-size:23px;line-height:1.3;}
  .quote .src{display:block;font-size:15px;color:rgba(0,0,0,.55);margin-top:12px;font-weight:600;}
  .need .t{font-weight:700;font-size:24px;line-height:1.2;margin-top:8px;}
  .need .m{font-size:17px;color:var(--ink-muted);margin-top:8px;}
  .panel{background:#fff;border:2px solid var(--charcoal);padding:22px 26px;}
  .next{background:var(--dot-green);color:#fff;border:0;padding:24px 28px;margin-top:auto;}
  .next .lbl{color:rgba(255,255,255,.8);}
  .next .what{font-family:var(--serif);font-size:30px;line-height:1.15;margin-top:8px;}
  .next .pass{font-size:19px;margin-top:10px;opacity:.95;}
  .ladder{display:flex;flex-direction:column;gap:12px;}
  .ladder .lbl{margin-bottom:6px;}
  .rung{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:center;padding:16px 18px;
    border:2px dashed #cfc8ba;background:rgba(255,255,255,.5);color:var(--ink-muted);position:relative;}
  .rung .n{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:21px;background:#fff;border:2px dashed #cfc8ba;}
  .rung .t{font-weight:700;font-size:21px;line-height:1.15;}
  .rung .d{font-size:15px;margin-top:3px;}
  .rung.done{border:2px solid var(--charcoal);background:#fff;color:var(--charcoal);}
  .rung.done .n{background:var(--dot-green);border:0;color:#fff;}
  .rung.here{border:3px solid var(--dot-green);background:rgba(46,139,87,.10);}
  .rung.here:after{content:"you are here";position:absolute;top:-12px;right:14px;background:var(--dot-green);color:#fff;
    font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;}
  .ladder .hint{font-size:15px;color:var(--ink-muted);margin-top:4px;}
  .err{padding:60px;font-size:20px;color:#DC2626;}
</style>
</head>
<body class="canvas-dots">
<div class="stage">
  <div class="head">
    <div>
      <div class="crumb" id="crumb"></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
    <a class="madeby" href="https://github.com/TexasBedouin/vibe-check" target="_blank" rel="noopener noreferrer">Created using <b>Vibe-Check</b> skill</a>
  </div>

  <div class="body">
    <div class="left" id="left"></div>
    <div class="ladder" id="ladder"></div>
  </div>
</div>

<script>
// ─── Verdict Card engine. One idea, one verdict, one rung, one next test. ───
// The ladder's rungs, the stamp wording, and every color are renderer-owned.
// Data only supplies the content and two enums: `verdict` and `rung`.
const RUNGS = [
  { n:5, t:'People pay',             d:'money changed hands for the thing' },
  { n:4, t:'People commit',          d:'a pre-order, a deposit, a signed letter' },
  { n:3, t:'People sign up',         d:'strangers raised a hand' },
  { n:2, t:'People work around it',  d:'they already spend time or money on a clumsy fix' },
  { n:1, t:'People complain',        d:'verified quotes, in their own words' },
];
const STAMP = {
  test:   { cls:'test',   label:'Worth testing' },
  narrow: { cls:'narrow', label:'Worth testing, narrower' },
  stop:   { cls:'stop',   label:'Not worth building as-is' },
};
const EVIDENCE = { seen:'seen it', hunch:'hunch', guess:'guess' };

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(v){
  const h = v.header || {};
  document.getElementById('crumb').textContent = h.crumb || '';
  document.getElementById('title').textContent = h.title || '';
  document.getElementById('sub').textContent = h.sub || '';

  // Unknown verdicts never silently pass as a green light.
  const stamp = STAMP[v.verdict] || { cls:'pending', label:'Verdict pending' };
  const need = v.need || {};
  const quote = v.quote || {};
  const next = v.nextTest || {};

  let left = '<div class="idea-box">' +
    '<div class="stamp ' + stamp.cls + '">' + stamp.label + '</div>' +
    '<div class="lbl">The idea</div>' +
    '<div class="idea">' + esc(v.idea || '') + '</div>' +
    (v.who ? '<div class="who">For ' + esc(v.who) + '</div>' : '') + '</div>';
  if (v.read) left += '<div class="read">' + esc(v.read) + '</div>';

  left += '<div class="row">';
  if (quote.text) left += '<div class="note y tilt-l quote"><span class="k">In their words</span>&ldquo;' + esc(quote.text) + '&rdquo;' +
    (quote.source ? '<span class="src">' + esc(quote.source) + '</span>' : '') + '</div>';
  if (need.label) left += '<div class="panel need"><div class="lbl">The top need</div><div class="t">' + esc(need.label) + '</div>' +
    '<div class="m">' + (need.score != null ? 'Opportunity ' + esc(need.score) + ' · ' : '') +
    (EVIDENCE[need.evidence] || EVIDENCE.guess) + '</div></div>';
  left += '</div>';

  if (next.what) left += '<div class="panel next"><div class="lbl">The next test</div><div class="what">' + esc(next.what) + '</div>' +
    (next.pass ? '<div class="pass">It passes if: ' + esc(next.pass) + '</div>' : '') + '</div>';
  document.getElementById('left').innerHTML = left;

  // Anything outside 1 to 5 shows an unclimbed ladder rather than a guess.
  const rung = Number.isInteger(v.rung) && v.rung >= 1 && v.rung <= 5 ? v.rung : 0;
  let ladder = '<div class="lbl" style="font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)">The evidence ladder</div>';
  RUNGS.forEach(r => {
    const cls = r.n === rung ? ' done here' : (r.n < rung ? ' done' : '');
    ladder += '<div class="rung' + cls + '"><div class="n">' + (r.n <= rung ? '✓' : r.n) + '</div>' +
      '<div><div class="t">' + r.t + '</div><div class="d">' + r.d + '</div></div></div>';
  });
  ladder += '<div class="hint">Saying is cheap. Doing costs something. Each rung up proves more.</div>';
  document.getElementById('ladder').innerHTML = ladder;

  document.body.setAttribute('data-rendered','1');
}

async function main(){
  const param = new URLSearchParams(location.search).get('data') || 'verdict-example';
  try{
    const v = await fetch('./data-'+param+'.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
    render(v);
  }catch(err){
    document.querySelector('.stage').innerHTML = '<div class="err">Could not load data-'+esc(param)+'.json: '+esc(err.message)+'</div>';
    document.body.setAttribute('data-rendered','1');
  }
}
main();
</script>
</body>
</html>
